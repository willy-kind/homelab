apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: audiobookshelf-config-pvc
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: homevault-staging
  resources:
    requests:
      storage: 1Gi

